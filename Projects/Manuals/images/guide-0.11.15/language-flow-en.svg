<svg xmlns="http://www.w3.org/2000/svg" width="760" height="528" viewBox="0 0 760 528" role="img" aria-label="There is more to do after 100%">
<rect width="760" height="528" rx="22" fill="#111a20"/>
<g font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
<text x="40" y="48" font-size="27" font-weight="700" fill="#ffffff">There is more to do after 100%</text>
<rect x="32" y="82" width="696" height="82" rx="12" fill="#203139"/>
<circle cx="65" cy="115" r="19" fill="#9ce6d4"/>
<text x="65" y="122" text-anchor="middle" font-size="22" fill="#10221f">1</text>
<text x="100" y="111" font-size="22" fill="#ffffff">1 · Transfer reaches 100%</text>
<text x="100" y="143" font-size="18" fill="#c9d8d7">The files have arrived. Installation is not finished yet.</text>
<path d="M65 160 v20" stroke="#7c918e" stroke-width="3"/>
<rect x="32" y="184" width="696" height="82" rx="12" fill="#203139"/>
<circle cx="65" cy="217" r="19" fill="#9ce6d4"/>
<text x="65" y="224" text-anchor="middle" font-size="22" fill="#10221f">2</text>
<text x="100" y="213" font-size="22" fill="#ffffff">2 · Verifying and saving</text>
<text x="100" y="245" font-size="18" fill="#c9d8d7">Noodoe checks and saves the files. Keep its power connected.</text>
<path d="M65 262 v20" stroke="#7c918e" stroke-width="3"/>
<rect x="32" y="286" width="696" height="82" rx="12" fill="#203139"/>
<circle cx="65" cy="319" r="19" fill="#9ce6d4"/>
<text x="65" y="326" text-anchor="middle" font-size="22" fill="#10221f">3</text>
<text x="100" y="315" font-size="22" fill="#ffffff">3 · Automatic restart → reconnect</text>
<text x="100" y="347" font-size="18" fill="#c9d8d7">Leave the app open while the device restarts and reconnects.</text>
<path d="M65 364 v20" stroke="#7c918e" stroke-width="3"/>
<rect x="32" y="388" width="696" height="82" rx="12" fill="#203139"/>
<circle cx="65" cy="421" r="19" fill="#9ce6d4"/>
<text x="65" y="428" text-anchor="middle" font-size="22" fill="#10221f">4</text>
<text x="100" y="417" font-size="22" fill="#ffffff">4 · Language resources ready</text>
<text x="100" y="449" font-size="18" fill="#c9d8d7">Choose the device language and confirm its restart prompt.</text>
<text x="40" y="511" font-size="17" fill="#9ce6d4">If resources stay incomplete, reconnect to the same unit and select Install / resume.</text></g></svg>