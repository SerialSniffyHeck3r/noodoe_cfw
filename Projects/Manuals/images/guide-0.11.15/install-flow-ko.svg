<svg xmlns="http://www.w3.org/2000/svg" width="760" height="732" viewBox="0 0 760 732" role="img" aria-label="처음 설치, 이 순서로 따라오세요">
<rect width="760" height="732" rx="22" fill="#111a20"/>
<g font-family="Segoe UI, Malgun Gothic, Arial, sans-serif">
